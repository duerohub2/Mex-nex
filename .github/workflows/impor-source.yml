name: Impor source aplikasi NEX-MEX

on:
  push:
    branches:
      - import/core-app-20261030
    paths:
      - .github/workflows/impor-source.yml

permissions:
  contents: write

jobs:
  impor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositori MEX-NEX
        uses: actions/checkout@v4
        with:
          ref: import/core-app-20261030

      - name: Ambil source aplikasi asal
        run: |
          git clone --depth 1 https://github.com/duerohub2/Nex-Mex.git /tmp/nex-mex-asal
          cp -a /tmp/nex-mex-asal/src ./src
          cp -a /tmp/nex-mex-asal/server ./server
          mkdir -p public
          cp -a /tmp/nex-mex-asal/public/office-assets ./public/office-assets
          cp /tmp/nex-mex-asal/next.config.ts ./next.config.ts
          cp /tmp/nex-mex-asal/postcss.config.mjs ./postcss.config.mjs
          cp /tmp/nex-mex-asal/tsconfig.json ./tsconfig.json
          cp /tmp/nex-mex-asal/components.json ./components.json
          cp /tmp/nex-mex-asal/eslint.config.mjs ./eslint.config.mjs
          cp /tmp/nex-mex-asal/package.json ./package.json
          cp /tmp/nex-mex-asal/package-lock.json ./package-lock.json
          cp /tmp/nex-mex-asal/scripts/start-local.mjs ./scripts/start-local.mjs
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('package.json','utf8')); p.name='mex-nex-local'; p.description='Kantor virtual AI agent lokal untuk Android dan Termux'; p.scripts={...p.scripts,'local:demo':'node scripts/start-local.mjs'}; fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
          npm install --package-lock-only --ignore-scripts

      - name: Simpan source hasil impor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src server public/office-assets next.config.ts postcss.config.mjs tsconfig.json components.json eslint.config.mjs package.json package-lock.json scripts/start-local.mjs
          git commit -m "Impor source kantor virtual dan gateway lokal" || echo "Tidak ada perubahan untuk disimpan"
          git push origin HEAD:import/core-app-20261030

# Pemicu impor source aplikasi inti.
