name: Uji build MEX-NEX

on:
  push:
    branches:
      - main
      - import/core-app-20261030
      - stage-5/qa-workflow-v1
    paths:
      - 'app/**'
      - 'src/**'
      - 'server/**'
      - 'scripts/**'
      - 'assets/**'
      - 'plugins/**'
      - 'tests/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.*'
      - '.github/workflows/uji-build.yml'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test -- --run tests/unit/qaWorkflow.test.ts tests/unit/officeWorkflows.test.ts tests/unit/officeApiStageFive.test.ts tests/unit/pixelOfficeAgentActivity.test.ts tests/unit/pixelOfficeMap.test.ts
      - run: npm run build
