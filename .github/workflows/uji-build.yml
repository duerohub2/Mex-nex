name: Uji build MEX-NEX

on:
  push:
    branches:
      - import/core-app-20261030
    paths:
      - .github/workflows/uji-build.yml
      - package.json
      - package-lock.json
      - src/**
      - server/**
      - next.config.ts
      - public/office-assets/**

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: import/core-app-20261030
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
